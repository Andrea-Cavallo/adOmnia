# Analisi Sonar di adOmnia — vale per SonarQube (locale o self-hosted) e SonarCloud.
#
# Locale (vedi docs/QUALITY.md):
#   docker run -d --name adomnia-sonar -p 9000:9000 sonarqube:community
#   sonar-scanner -Dsonar.host.url=http://localhost:9000 -Dsonar.token=<token>
# SonarCloud: il workflow .github/workflows/quality.yml passa projectKey, organization e host.

sonar.projectKey=adomnia
sonar.projectName=adOmnia
sonar.sourceEncoding=UTF-8

# Codice sorgente: Go (root bindings, cmd/, internal/), TypeScript (frontend/src), script (scripts/, build/, docker/).
sonar.sources=.
sonar.exclusions=\
  frontend/dist/**,\
  frontend/coverage/**,\
  frontend/node_modules/**,\
  frontend/bindings/**,\
  frontend/src/wailsjs/**,\
  **/*.generated.*,\
  **/testdata/**,\
  **/node_modules/**,\
  **/*.min.js,\
  **/*.map,\
  **/package-lock.json,\
  workspaces/**,\
  .artifacts/**,\
  .planning/**,\
  .tokensave/**,\
  assets/**,\
  mds/**,\
  docs/**,\
  winres/**

# I test vivono accanto al codice (_test.go) e in *.test.ts/.mjs: non sono sorgente.
sonar.tests=.
sonar.test.inclusions=**/*_test.go,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/*.test.mjs

# Traduzioni: le chiavi si ripetono per ogni lingua, la duplicazione è fisiologica. Restano
# analizzate per issue e coverage, escono solo dal calcolo della duplicazione (CPD).
sonar.cpd.exclusions=\
  frontend/src/lib/translations/**

# Coverage (opzionale): generarla prima della scansione, le righe sotto dicono come.
sonar.go.coverage.reportPaths=coverage.out
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# SonarCloud: sbloccare e compilare, oppure passarli da CI (-Dsonar.organization=…).
#sonar.organization=<organization-github>
#sonar.host.url=https://sonarcloud.io
