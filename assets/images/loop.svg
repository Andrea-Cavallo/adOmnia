<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 340" width="980" height="340" role="img" aria-labelledby="loop-title loop-desc">
  <title id="loop-title">adOmnia request loop</title>
  <desc id="loop-desc">Code Studio starts the service under Delve, API Workspace sends the request, and Debug Request stops at the handler breakpoint, with variables, logs, SQL and messages captured for the same request.</desc>
  <defs>
    <pattern id="loop-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.12"/>
    </pattern>
    <marker id="loop-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9a9a9a"/>
    </marker>
    <marker id="loop-arrow-focal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect width="980" height="340" rx="8" fill="#000000"/>
  <rect width="980" height="340" rx="8" fill="url(#loop-dots)"/>

  <!-- arrows first, boxes after -->
  <path d="M92 112 V72 Q92 64 100 64 H612 Q620 64 620 72 V108" fill="none" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="3,5" stroke-linecap="round" marker-end="url(#loop-arrow)"/>
  <line x1="168" y1="152" x2="280" y2="152" stroke="#9a9a9a" stroke-width="1.5" marker-end="url(#loop-arrow)"/>
  <line x1="432" y1="152" x2="544" y2="152" stroke="#9a9a9a" stroke-width="1.5" marker-end="url(#loop-arrow)"/>
  <line x1="696" y1="152" x2="808" y2="152" stroke="#ffffff" stroke-width="2.5" marker-end="url(#loop-arrow-focal)"/>
  <line x1="884" y1="196" x2="884" y2="248" stroke="#9a9a9a" stroke-width="1.5" marker-start="url(#loop-arrow)" marker-end="url(#loop-arrow)"/>

  <!-- stages -->
  <g fill="#000000" stroke="#ffffff" stroke-width="1.2">
    <rect x="20" y="112" width="144" height="80" rx="6"/>
    <rect x="284" y="112" width="144" height="80" rx="6"/>
    <rect x="548" y="112" width="144" height="80" rx="6"/>
    <rect x="812" y="112" width="144" height="80" rx="6" fill="#ffffff"/>
  </g>
  <g fill="#ffffff">
    <circle cx="32" cy="124" r="2.5"/>
    <circle cx="296" cy="124" r="2.5"/>
    <circle cx="560" cy="124" r="2.5"/>
  </g>
  <circle cx="824" cy="124" r="2.5" fill="#000000"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="2" text-anchor="middle" fill="#9a9a9a">
    <text x="92" y="140">WRITE</text>
    <text x="356" y="140">RUN</text>
    <text x="620" y="140">CALL</text>
    <text x="884" y="140" fill="#000000">UNDERSTAND</text>
  </g>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#ffffff">
    <text x="92" y="166">Code Studio</text>
    <text x="356" y="166">Live service</text>
    <text x="620" y="166">API Workspace</text>
    <text x="884" y="166" fill="#000000">Handler</text>
  </g>

  <!-- arrow labels: beside the stroke, 8px clear -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.5" text-anchor="middle" fill="#9a9a9a">
    <text x="356" y="52">READS ROUTES</text>
    <text x="224" y="140">UNDER DELVE</text>
    <text x="488" y="140">SENDS REQUEST</text>
    <text x="868" y="226" text-anchor="end">SAME REQUEST</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.5" text-anchor="middle" fill="#ffffff">
    <text x="752" y="140">DEBUG REQUEST</text>
    <text x="752" y="172">BREAKPOINT</text>
  </g>

  <!-- evidence for the same request -->
  <rect x="548" y="252" width="408" height="48" rx="6" fill="#000000" stroke="#ffffff" stroke-width="1.2"/>
  <text x="752" y="281" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff">Variables · logs · SQL · messages</text>
  <text x="20" y="320" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="0.5" fill="#9a9a9a">SQL, messages and logs appear once capture is configured for the service.</text>
</svg>
