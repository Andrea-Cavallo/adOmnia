version: '3'

includes:
  common: ../Taskfile.yml

vars:
  WINDOWS_ARCH: '{{.ARCH | default "amd64"}}'
  # CI supplies VERSION from the release tag. Local builds use the current
  # release version, so Windows never receives a non-numeric `dev` resource.
  WINDOWS_VERSION: '{{.VERSION | default "0.9.31"}}'
  GENERATED_INFO: '../.wails/windows-info-{{.WINDOWS_ARCH}}.json'
  GENERATED_MANIFEST: '../.wails/windows-manifest-{{.WINDOWS_ARCH}}.xml'

tasks:
  build:
    deps:
      - task: common:build:frontend
    cmds:
      - task: generate:syso
      - go build -buildvcs=false -trimpath -tags production -ldflags="-s -w -H windowsgui {{.LD_VERSION}}" -o {{.BIN_DIR}}/{{.APP_NAME}}.exe .
      - cmd: powershell -NoProfile -Command "Remove-Item -Force -ErrorAction SilentlyContinue -LiteralPath 'wails_windows_{{.WINDOWS_ARCH}}.syso', '.wails/windows-info-{{.WINDOWS_ARCH}}.json', '.wails/windows-manifest-{{.WINDOWS_ARCH}}.xml'"

  generate:syso:
    summary: Embed the Windows icon, manifest and version metadata into the executable.
    dir: build
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File ../scripts/render-windows-build-metadata.ps1 -Version "{{.WINDOWS_VERSION}}" -InfoTemplatePath windows/info.template.json -ManifestTemplatePath windows/wails.exe.manifest.template -InfoOutputPath "{{.GENERATED_INFO}}" -ManifestOutputPath "{{.GENERATED_MANIFEST}}"
      - wails3 generate syso -arch {{.WINDOWS_ARCH}} -icon windows/icon.ico -manifest "{{.GENERATED_MANIFEST}}" -info "{{.GENERATED_INFO}}" -out ../wails_windows_{{.WINDOWS_ARCH}}.syso

  package:
    summary: Windows ships the bare executable, so packaging is just a build.
    deps:
      - task: build
    cmds:
      - cmd: echo "Built {{.BIN_DIR}}/{{.APP_NAME}}.exe"

  run:
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}.exe'
