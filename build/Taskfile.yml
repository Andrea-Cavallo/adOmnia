version: '3'

tasks:
  go:mod:tidy:
    internal: true
    cmds:
      - go mod tidy

  install:frontend:deps:
    dir: frontend
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules/*
    cmds:
      - npm install

  generate:bindings:
    deps:
      - task: go:mod:tidy
    sources:
      - '*.go'
      - internal/**/*.go
      - go.mod
      - go.sum
    generates:
      - frontend/bindings/**/*
    cmds:
      - wails3 generate bindings -clean=true -ts ./...

  build:frontend:
    dir: frontend
    deps:
      - task: install:frontend:deps
      - task: generate:bindings
    cmds:
      - npm run build

  dev:frontend:
    dir: frontend
    deps:
      - task: install:frontend:deps
    cmds:
      - npm run dev -- --port {{.VITE_PORT}}
