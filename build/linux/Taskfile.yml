version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  build:
    deps:
      - task: common:build:frontend
    env:
      # Wails still needs deprecated GDK X11 accessors for window positioning.
      # Suppress GDK deprecation annotations only, not other compiler warnings.
      CGO_CFLAGS: '{{.CGO_CFLAGS | default "-O2 -g"}} -DGDK_DISABLE_DEPRECATION_WARNINGS'
    cmds:
      # Local builds use Wails' default GTK4/WebKitGTK 6 backend.
      # Packaging can explicitly select the GTK3 compatibility backend.
      - go build -buildvcs=false -trimpath -tags '{{.LINUX_BUILD_TAGS | default "production"}}' -ldflags="-s -w {{.LD_VERSION}}" -o {{.BIN_DIR}}/{{.APP_NAME}} .

  package:
    summary: Build native Wails 3 Linux tarballs.
    cmds:
      - bash build/linux/package-native-tarballs.sh {{.VERSION | default "dev"}}

  run:
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}'
