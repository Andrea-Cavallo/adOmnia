version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  build:
    deps:
      - task: common:build:frontend
    cmds:
      # Linux releases target Wails' GTK3/WebKitGTK 4.1 backend. Keep both
      # production and gtk3 here instead of relying on a Task variable that
      # cannot be overridden through the packaging script's environment.
      - go build -buildvcs=false -trimpath -tags 'production gtk3' -ldflags="-s -w {{.LD_VERSION}}" -o {{.BIN_DIR}}/{{.APP_NAME}} .

  package:
    summary: Build native Wails 3 Linux tarballs.
    cmds:
      - bash build/linux/package-native-tarballs.sh {{.VERSION | default "dev"}}

  run:
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}'
