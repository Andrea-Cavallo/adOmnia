name: Go + Wails prerequisites
description: >
  Linux libraries and the embedded-frontend placeholder that the Go tools need to load the Wails packages
  (lint, vulnerability scan, SAST, CodeQL). Without them Wails picks GTK4 and the root package fails to
  type-check on `//go:embed all:frontend/dist`. Use together with the `gtk3` build tag.

inputs:
  embed-placeholder:
    description: Create a stub frontend/dist so the root package type-checks (not needed when the real frontend is built).
    default: 'true'

runs:
  using: composite
  steps:
    - name: Install Linux Wails dependencies
      shell: bash
      run: |
        sudo rm -f /etc/apt/sources.list.d/*google* /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure-cli*
        export DEBIAN_FRONTEND=noninteractive
        # Timeout e ritentativi: una connessione al mirror che non risponde non deve tenere fermo il job
        # (alcune run hanno passato 7-10 minuti in questo step senza timeout). Il mirror resta lento
        # ogni tanto, quindi l'installazione stessa viene ritentata: un download interrotto ricomincia
        # dai pacchetti mancanti, non da zero.
        apt_opts=(-o Acquire::Retries=5 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
        for attempt in 1 2 3; do
          sudo apt-get "${apt_opts[@]}" update -q || echo "apt update failed (attempt ${attempt}/3), continuing with the lists already cached" >&2
          if sudo -E apt-get "${apt_opts[@]}" install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev; then
            break
          fi
          if [ "$attempt" = 3 ]; then
            echo "apt install failed after 3 attempts" >&2
            exit 1
          fi
          echo "apt install failed (attempt ${attempt}/3), retrying in 10s" >&2
          sleep 10
        done

    - name: Stub the embedded frontend
      if: ${{ inputs.embed-placeholder == 'true' }}
      shell: bash
      run: |
        mkdir -p frontend/dist
        [ -e frontend/dist/index.html ] || printf '<!doctype html><title>adOmnia</title>\n' > frontend/dist/index.html
