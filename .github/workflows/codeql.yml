name: CodeQL

# Analisi semantica di sicurezza di GitHub (gratuita per i repository pubblici):
# trova pattern vulnerabili in Go e TypeScript che lint e test non vedono.
# I risultati compaiono nella tab Security del repository.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '30 5 * * 1'
  workflow_dispatch:

# Least-privilege default for GITHUB_TOKEN; the analyze job raises security-events: write
# to upload SARIF results to code scanning.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-22.04
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Go non supporta build-mode "none": serve una build vera. Come in build.yml servono le
          # librerie GTK3 e il tag gtk3; il package radice (embed di frontend/dist) resta fuori.
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        if: ${{ matrix.language == 'go' }}
        with:
          go-version-file: go.mod
          cache: true

      - uses: ./.github/actions/go-wails-prereqs
        if: ${{ matrix.language == 'go' }}
        with:
          embed-placeholder: 'false'

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build Go
        if: ${{ matrix.language == 'go' }}
        run: go build -tags gtk3 ./internal/... ./cmd/...

      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: "/language:${{ matrix.language }}"
