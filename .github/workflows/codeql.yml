name: CodeQL

# Analisi semantica di sicurezza di GitHub (gratuita per i repository pubblici):
# trova pattern vulnerabili in Go e TypeScript che lint e test non vedono.
# I risultati compaiono nella tab Security del repository.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '30 5 * * 1'
  workflow_dispatch:

# Least-privilege default for GITHUB_TOKEN; the analyze job raises security-events: write
# to upload SARIF results to code scanning.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-22.04
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Go non supporta build-mode "none": serve una build vera. Come in build.yml servono le
          # librerie GTK3 e il tag gtk3; il package radice (embed di frontend/dist) resta fuori.
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: ${{ matrix.language == 'go' }}
        with:
          go-version-file: go.mod
          cache: true

      - uses: ./.github/actions/go-wails-prereqs
        if: ${{ matrix.language == 'go' }}
        with:
          embed-placeholder: 'false'

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build Go
        if: ${{ matrix.language == 'go' }}
        run: go build -tags gtk3 ./internal/... ./cmd/...

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
