name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.2.3)'
        required: true

env:
  WAILS_VERSION: v2.12.0

# ─────────────────────────────────────────────────────────────────────────────
# WINDOWS · amd64
# Builds natively and uploads a plain .exe without UPX.
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  build-windows:
    name: Windows · amd64
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag:     ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Extract version
        id: ver
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if (-not $tag -or -not $tag.StartsWith('v')) { $tag = "${{ inputs.tag }}" }
          $ver = $tag.TrimStart('v')
          echo "tag=$tag"     >> $env:GITHUB_OUTPUT
          echo "version=$ver" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build
        run: wails build

      - name: Stage artifact
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build\bin\adomnia.exe "dist\adomnia-$ver-windows-amd64.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: windows-amd64
          path: dist/adomnia-*-windows-amd64.exe

# ─────────────────────────────────────────────────────────────────────────────
# LINUX · amd64
# Builds native tarballs for both WebKitGTK 4.0 and 4.1.
# ─────────────────────────────────────────────────────────────────────────────
  build-linux:
    name: Linux · amd64 tarballs
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Extract version
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME:-${{ inputs.tag }}}"
          [[ "$TAG" != v* ]] && TAG="${{ inputs.tag }}"
          echo "tag=$TAG"          >> $GITHUB_OUTPUT
          echo "version=${TAG#v}"  >> $GITHUB_OUTPUT

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build Linux native tarballs
        run: |
          VER="${{ steps.ver.outputs.version }}"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BUILD_DATE="${BUILD_DATE}" GIT_COMMIT="${GITHUB_SHA}" \
            bash build/linux/package-native-tarballs.sh "$VER"
          ls -lh dist

      - uses: actions/upload-artifact@v7
        with:
          name: linux-amd64
          path: |
            dist/adomnia-*-linux-amd64-webkitgtk-*.tar.gz
            dist/adomnia-*-linux-amd64-webkitgtk-*.tar.gz.sha256

# ─────────────────────────────────────────────────────────────────────────────
# MACOS · universal (arm64 + amd64 via lipo)
# Builds both slices on the macOS runner, merges with lipo,
# packages as DMG with create-dmg (fallback: hdiutil)
# UPX skipped — not supported on Apple Silicon
# ─────────────────────────────────────────────────────────────────────────────
  build-macos:
    name: macOS · universal
    runs-on: macos-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Extract version
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME:-${{ inputs.tag }}}"
          [[ "$TAG" != v* ]] && TAG="${{ inputs.tag }}"
          echo "tag=$TAG"          >> $GITHUB_OUTPUT
          echo "version=${TAG#v}"  >> $GITHUB_OUTPUT

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build arm64 slice
        run: |
          wails build -platform darwin/arm64
          cp build/bin/adomnia.app/Contents/MacOS/adomnia /tmp/adomnia-arm64

      - name: Build amd64 slice
        run: |
          wails build -platform darwin/amd64
          cp build/bin/adomnia.app/Contents/MacOS/adomnia /tmp/adomnia-amd64

      - name: Merge into universal binary
        run: |
          lipo -create /tmp/adomnia-arm64 /tmp/adomnia-amd64 \
            -output build/bin/adomnia.app/Contents/MacOS/adomnia
          chmod +x build/bin/adomnia.app/Contents/MacOS/adomnia
          lipo -info build/bin/adomnia.app/Contents/MacOS/adomnia

      - name: Create DMG
        run: |
          VER="${{ steps.ver.outputs.version }}"
          mkdir -p dist
          create-dmg \
            --volname "adomnia $VER" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "adomnia.app" 150 190 \
            --hide-extension "adomnia.app" \
            --app-drop-link 450 190 \
            "dist/adomnia-$VER-macos-universal.dmg" \
            "build/bin/" \
          || hdiutil create \
            -volname "adomnia $VER" \
            -srcfolder "build/bin/adomnia.app" \
            -ov -format UDZO \
            "dist/adomnia-$VER-macos-universal.dmg"

      - uses: actions/upload-artifact@v7
        with:
          name: macos-universal
          path: dist/adomnia-*-macos-universal.dmg

# ─────────────────────────────────────────────────────────────────────────────
# PUBLISH · GitHub Release
# Collects all three artifacts, generates SHA256SUMS.txt,
# publishes as GitHub Release (pre-release if tag contains -rc/-beta/-alpha)
# ─────────────────────────────────────────────────────────────────────────────
  release:
    name: Publish Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Extract version
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME:-${{ inputs.tag }}}"
          [[ "$TAG" != v* ]] && TAG="${{ inputs.tag }}"
          echo "tag=$TAG"          >> $GITHUB_OUTPUT
          echo "version=${TAG#v}"  >> $GITHUB_OUTPUT

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          echo "--- Release artifacts ---"
          ls -lh

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: adOmnia ${{ steps.ver.outputs.version }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: >-
            ${{
              contains(steps.ver.outputs.tag, '-rc')   ||
              contains(steps.ver.outputs.tag, '-beta')  ||
              contains(steps.ver.outputs.tag, '-alpha')
            }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
