name: Supply chain

# Sicurezza della catena di fornitura: revisione dei cambiamenti di dipendenza nelle PR
# e punteggio OSSF Scorecard del repository (come su ossf-scorecard.dev).

on:
  pull_request:
    branches: [main, develop]
  # Scorecard pubblica il punteggio (e il badge) solo da un run sul branch predefinito.
  push:
    branches: [main]
  schedule:
    - cron: '45 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Blocca le PR che introducono dipendenze con vulnerabilità note (richiede GitHub Advanced
      # Security solo per le private repo: per i repository pubblici è gratuito).
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0
          # elkjs (the ELK layout behind Diagram Studio) is dual-licensed "EPL-2.0 OR GPL-3.0-or-later".
          # adOmnia uses it under EPL-2.0, so the GPL branch of the SPDX expression must not fail the
          # license gate; deny-licenses still blocks any dependency licensed GPL-3.0 alone.
          allow-dependencies-licenses: pkg:npm/elkjs

  scorecard:
    name: OSSF Scorecard
    runs-on: ubuntu-22.04
    permissions:
      security-events: write
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: results.sarif
