name: Supply chain

# Sicurezza della catena di fornitura: revisione dei cambiamenti di dipendenza nelle PR
# e punteggio OSSF Scorecard del repository (come su ossf-scorecard.dev).

on:
  pull_request:
    branches: [main, develop]
  # Scorecard pubblica il punteggio (e il badge) solo da un run sul branch predefinito.
  push:
    branches: [main]
  schedule:
    - cron: '45 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Blocca le PR che introducono dipendenze con vulnerabilità note (richiede GitHub Advanced
      # Security solo per le private repo: per i repository pubblici è gratuito).
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0

  scorecard:
    name: OSSF Scorecard
    runs-on: ubuntu-22.04
    permissions:
      security-events: write
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          sarif_file: results.sarif
