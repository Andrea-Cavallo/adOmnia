name: Build Desktop Artifacts

on:
  push:
    branches: [master, main, develop]
    tags: ['v*']
  pull_request:
    branches: [master, main, develop]
  workflow_dispatch:

env:
  APP_NAME: adomnia
  WAILS_VERSION: v2.12.0
  NODE_VERSION: '20'

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux Wails dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libayatana-appindicator3-dev

      - name: Frontend build
        working-directory: frontend
        run: npm ci && npm run build

      - name: Go tests
        run: go test ./...

  windows:
    name: Windows exe
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build Windows exe
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "${{ github.sha }}".Substring(0, 7) }
          $date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          wails build -clean -platform windows/amd64 -ldflags "-s -w -H windowsgui -X main.Version=$version -X main.BuildDate=$date -X main.GitCommit=${{ github.sha }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build\bin\adomnia.exe "dist\adomnia-$version-windows-amd64.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: adomnia-windows-amd64
          path: dist/*.exe
          retention-days: 30

  linux:
    name: Linux tarballs
    needs: checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build Linux native tarballs
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then VERSION="${GITHUB_SHA::7}"; fi
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BUILD_DATE="${BUILD_DATE}" GIT_COMMIT="${GITHUB_SHA}" \
            bash build/linux/package-native-tarballs.sh "${VERSION}"

          ls -lh dist

      - uses: actions/upload-artifact@v7
        with:
          name: adomnia-linux-amd64
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          retention-days: 30

  macos:
    name: macOS dmg
    needs: checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install packaging tools
        run: |
          brew list create-dmg >/dev/null 2>&1 || brew install create-dmg
          go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}

      - name: Build Apple Silicon app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then VERSION="${GITHUB_SHA::7}"; fi
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          wails build -clean -platform darwin/arm64 -ldflags "-s -w -X main.Version=${VERSION} -X main.BuildDate=${BUILD_DATE} -X main.GitCommit=${GITHUB_SHA}"
          cp build/bin/adomnia.app/Contents/MacOS/adomnia /tmp/adomnia-arm64

      - name: Build Intel app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then VERSION="${GITHUB_SHA::7}"; fi
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          wails build -clean -platform darwin/amd64 -ldflags "-s -w -X main.Version=${VERSION} -X main.BuildDate=${BUILD_DATE} -X main.GitCommit=${GITHUB_SHA}"
          cp build/bin/adomnia.app/Contents/MacOS/adomnia /tmp/adomnia-amd64

      - name: Create universal dmg
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then VERSION="${GITHUB_SHA::7}"; fi
          lipo -create /tmp/adomnia-arm64 /tmp/adomnia-amd64 -output build/bin/adomnia.app/Contents/MacOS/adomnia
          chmod +x build/bin/adomnia.app/Contents/MacOS/adomnia
          lipo -info build/bin/adomnia.app/Contents/MacOS/adomnia
          mkdir -p dist
          create-dmg \
            --volname "adomnia ${VERSION}" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "adomnia.app" 150 190 \
            --hide-extension "adomnia.app" \
            --app-drop-link 450 190 \
            "dist/adomnia-${VERSION}-macos-universal.dmg" \
            "build/bin/" \
          || hdiutil create \
            -volname "adomnia ${VERSION}" \
            -srcfolder "build/bin/adomnia.app" \
            -ov -format UDZO \
            "dist/adomnia-${VERSION}-macos-universal.dmg"

      - uses: actions/upload-artifact@v7
        with:
          name: adomnia-macos-universal
          path: dist/*.dmg
          retention-days: 30

  bundle:
    name: Bundle artifacts
    needs: [windows, linux, macos]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          ls -lh

      - uses: actions/upload-artifact@v7
        with:
          name: adomnia-desktop-artifacts
          path: dist/*
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
