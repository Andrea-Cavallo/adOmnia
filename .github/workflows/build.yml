name: Build Desktop Artifacts

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  APP_NAME: adomnia
  WAILS_VERSION: v3.0.0-beta.32
  NODE_VERSION: '22.13.0'

# Least-privilege default for GITHUB_TOKEN; the publishing job raises contents: write.
permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Wails version consistency
        run: node scripts/check-wails-version.mjs

      # Stessa installazione degli altri workflow (azione condivisa). Il frontend reale si compila più sotto,
      # quindi niente stub di frontend/dist. Il timeout evita che un mirror apt bloccato tenga il job per ore.
      - uses: ./.github/actions/go-wails-prereqs
        timeout-minutes: 10
        with:
          embed-placeholder: 'false'

      - name: Installation scripts acceptance
        run: |
          python3 scripts/test_install.py
          python3 build/linux/test_user_install.py

      - name: Frontend build
        working-directory: frontend
        run: npm ci --ignore-scripts && npm test && npm run build && npm run check:startup

      - name: Startup bundle budget
        working-directory: frontend
        run: npm run check:startup

      - name: Go tests
        # Linux artifacts intentionally target Wails' GTK3/WebKitGTK 4.1
        # compatibility backend. Without this tag Wails defaults to GTK4 and
        # WebKitGTK 6.0, which are not the libraries installed above.
        run: go test -count=1 -timeout=15m -tags gtk3 -coverprofile=coverage.out -covermode=atomic ./...

      # Stessa esecuzione dei test, nessun secondo giro: il numero finisce nel riepilogo del job.
      - name: Go coverage report
        if: ${{ !cancelled() }}
        run: bash scripts/coverage-summary.sh coverage.out >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage profile
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: go-coverage
          path: coverage.out
          if-no-files-found: ignore
          retention-days: 30

  windows:
    name: Windows exe
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Log Inspector final scenario
        working-directory: frontend
        run: npm ci --ignore-scripts && npm run test -- src/lib/loginspector/finalScenario.test.ts src/lib/loginspector/platformJourneyContract.test.ts

      - name: Code Studio disaster recovery
        # Kill reale durante le snapshot, 10 buffer sporchi, store per workspace (Linux: go test ./... in Checks).
        run: go test ./internal/codestudio/ -run "Recover|Kill|Crash" -count=1

      - name: Updater on Windows
        # Swap reale dell'exe (rename sopra il file appena chiuso), rollback e conferma d'avvio su NTFS.
        run: go test ./internal/update/ -count=1

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Build Windows exe
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "${{ github.sha }}".Substring(0, 7) }
          $date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          # Release metadata reaches Task through the environment. Passing it as
          # `wails3 task ... VERSION=x` silently does nothing.
          $env:VERSION = $version
          $env:BUILD_DATE = $date
          $env:GIT_COMMIT = "${{ github.sha }}"
          wails3 task windows:build
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item bin\adomnia.exe "dist\adomnia-$version-windows-amd64.exe"
          Compress-Archive -LiteralPath bin/adomnia.exe -DestinationPath "dist/adomnia-$version-windows-amd64-update.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: adomnia-windows-amd64
          path: dist/adomnia-*-windows-amd64*
          retention-days: 30

  linux:
    name: Linux tarballs
    needs: checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Log Inspector final scenario
        working-directory: frontend
        run: npm ci --ignore-scripts && npm run test -- src/lib/loginspector/finalScenario.test.ts src/lib/loginspector/platformJourneyContract.test.ts

      - name: Install Linux native dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/*google* /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure-cli*
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config

      - name: Install Wails CLI
        # Keep the CLI on the same GTK3/WebKitGTK 4.1 backend as the Linux build.
        run: GOFLAGS=-tags=gtk3 go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Build Linux native tarballs
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then VERSION="${GITHUB_SHA::7}"; fi
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BUILD_DATE="${BUILD_DATE}" GIT_COMMIT="${GITHUB_SHA}" \
            bash build/linux/package-native-tarballs.sh "${VERSION}"

          zip -j "dist/adomnia-${VERSION}-linux-amd64-update.zip" bin/adomnia
          ls -lh dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: adomnia-linux-amd64
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*-linux-amd64-update.zip
          retention-days: 30

  macos:
    name: macOS dmg
    needs: checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Log Inspector final scenario
        working-directory: frontend
        run: npm ci --ignore-scripts && npm run test -- src/lib/loginspector/finalScenario.test.ts src/lib/loginspector/platformJourneyContract.test.ts

      - name: Code Studio disaster recovery
        # Kill reale durante le snapshot, 10 buffer sporchi, store per workspace (Linux: go test ./... in Checks).
        run: go test ./internal/codestudio/ -run "Recover|Kill|Crash" -count=1

      - name: Install packaging tools
        run: brew list create-dmg >/dev/null 2>&1 || brew install create-dmg # NOSONAR -- Homebrew has no version pinning: create-dmg only packages the artifacts this job already built, and the app zip is checksummed at release

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }} # NOSONAR -- WAILS_VERSION is the repository pin (v3.0.0-beta.32), the same version go.mod builds against

      - name: Build universal app and DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then VERSION="${GITHUB_SHA::7}"; fi
          VERSION="$VERSION" BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" GIT_COMMIT="${GITHUB_SHA}" \
            bash scripts/build-macos.sh
          cd dist
          zip -r "adomnia-${VERSION}-macos-universal-update.zip" adomnia.app

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: adomnia-macos-universal
          path: |
            dist/*.dmg
            dist/*-macos-universal-update.zip
          retention-days: 30

  bundle:
    name: Bundle artifacts
    needs: [windows, linux, macos]
    # This is the only job that needs contents: write (it signs and publishes the release),
    # so it must never run on a pull_request: a write token on a PR branch, including a
    # same-repo one, is exactly the escalation the least-privilege rule prevents. The
    # per-platform artifacts stay available on PRs from the three build jobs above.
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Locate release notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then echo "path=$NOTES" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          go-version-file: go.mod
          cache: true

      - name: Sign updater manifest
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ADOMNIA_UPDATE_SIGNING_KEY: ${{ secrets.ADOMNIA_UPDATE_SIGNING_KEY }}
        run: go run ./cmd/update-manifest -dir dist -version "${{ github.ref_name }}"

      - name: Generate checksums
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS.txt
          ls -lh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: adomnia-desktop-artifacts
          path: dist/*
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: dist/*
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.path == '' }}
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
