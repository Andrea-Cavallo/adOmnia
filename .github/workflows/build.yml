name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  WAILS_VERSION: v2.12.0

jobs:
  # ── Lint & type check ──────────────────────────────────────────────────────
  test:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # webkit headers required for CGO even in go vet
      - name: Install Linux deps
        run: sudo apt-get update -q && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: go vet
        run: go vet ./...

      - name: Check Go formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Frontend type check
        working-directory: frontend
        run: npm ci && npx tsc --noEmit

  # ── Native build per platform ──────────────────────────────────────────────
  build:
    name: Build (${{ matrix.name }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-amd64
            artifact: build/bin/adomnia.exe
          - os: macos-latest
            name: macos-arm64
            zip: adomnia-macos-arm64.zip
          - os: ubuntu-latest
            name: linux-amd64
            artifact: build/bin/adomnia

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      # wails build: installs frontend deps, builds frontend, embeds into binary
      - name: Build
        run: wails build -clean

      # macOS produces a .app bundle (directory) — zip before upload
      - name: Zip macOS app
        if: runner.os == 'macOS'
        run: zip -r ${{ matrix.zip }} build/bin/adomnia.app

      - name: Upload (Windows / Linux)
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: adomnia-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          retention-days: 30

      - name: Upload (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: adomnia-${{ matrix.name }}
          path: ${{ matrix.zip }}
          retention-days: 30

  # ── GitHub Release (tags only) ─────────────────────────────────────────────
  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && ls -lh

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
