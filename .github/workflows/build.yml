name: Build Desktop Artifacts

on:
  push:
    branches: [master, main, develop]
    tags: ['v*']
  pull_request:
    branches: [master, main, develop]
  workflow_dispatch:

env:
  APP_NAME: adomnia
  WAILS_VERSION: v3.0.0-beta.5
  NODE_VERSION: '20'

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux Wails dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev

      - name: Frontend build
        working-directory: frontend
        run: npm ci && npm run build

      - name: Go tests
        # Linux artifacts intentionally target Wails' GTK3/WebKitGTK 4.1
        # compatibility backend. Without this tag Wails defaults to GTK4 and
        # WebKitGTK 6.0, which are not the libraries installed above.
        run: go test -tags gtk3 ./...

  windows:
    name: Windows exe
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Build Windows exe
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "${{ github.sha }}".Substring(0, 7) }
          $date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          # Release metadata reaches Task through the environment. Passing it as
          # `wails3 task ... VERSION=x` silently does nothing.
          $env:VERSION = $version
          $env:BUILD_DATE = $date
          $env:GIT_COMMIT = "${{ github.sha }}"
          wails3 task windows:build
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item bin\adomnia.exe "dist\adomnia-$version-windows-amd64.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: adomnia-windows-amd64
          path: dist/*.exe
          retention-days: 30

  linux:
    name: Linux tarballs
    needs: checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Build Linux native tarballs
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then VERSION="${GITHUB_SHA::7}"; fi
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BUILD_DATE="${BUILD_DATE}" GIT_COMMIT="${GITHUB_SHA}" \
            bash build/linux/package-native-tarballs.sh "${VERSION}"

          ls -lh dist

      - uses: actions/upload-artifact@v7
        with:
          name: adomnia-linux-amd64
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          retention-days: 30

  macos:
    name: macOS dmg
    needs: checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install packaging tools
        run: |
          brew list create-dmg >/dev/null 2>&1 || brew install create-dmg
          go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}

      - name: Build universal app and DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then VERSION="${GITHUB_SHA::7}"; fi
          VERSION="$VERSION" BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" GIT_COMMIT="${GITHUB_SHA}" \
            bash scripts/build-macos.sh

      - uses: actions/upload-artifact@v7
        with:
          name: adomnia-macos-universal
          path: dist/*.dmg
          retention-days: 30

  bundle:
    name: Bundle artifacts
    needs: [windows, linux, macos]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          ls -lh

      - uses: actions/upload-artifact@v7
        with:
          name: adomnia-desktop-artifacts
          path: dist/*
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
