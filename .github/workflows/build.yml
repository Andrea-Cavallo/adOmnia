name: Build Desktop Artifacts

on:
  push:
    branches: [master, main, develop]
    tags: ['v*']
  pull_request:
    branches: [master, main, develop]
  workflow_dispatch:

env:
  APP_NAME: adOmnia
  WAILS_VERSION: v2.12.0
  NODE_VERSION: '20'

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux Wails dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libayatana-appindicator3-dev

      - name: Frontend build
        working-directory: frontend
        run: npm ci && npm run build

      - name: Install Python SDK dependencies for plugin tests
        run: pip install "grpcio>=1.60.0"

      - name: Go tests
        run: go test ./...

  windows:
    name: Windows exe
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build Windows exe
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "${{ github.sha }}".Substring(0, 7) }
          $date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          wails build -clean -platform windows/amd64 -ldflags "-s -w -H windowsgui -X main.Version=$version -X main.BuildDate=$date -X main.GitCommit=${{ github.sha }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build\bin\adOmnia.exe "dist\adOmnia-$version-windows-amd64.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: adOmnia-windows-amd64
          path: dist/*.exe
          retention-days: 30

  linux:
    name: Linux tarballs
    needs: checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build Linux native tarballs
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then VERSION="${GITHUB_SHA::7}"; fi
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p dist

          package_tarball() {
            local variant="$1"
            local readme_note="$2"
            local basename="${APP_NAME}-${VERSION}-linux-amd64-${variant}"
            local stage="dist/${basename}"

            rm -rf "$stage"
            mkdir -p "$stage/icons"

            cp build/bin/adOmnia "$stage/adOmnia"
            chmod +x "$stage/adOmnia"

            for size in 16 24 32 48 64 128 256 512; do
              icon="assets/icons/linux/adOmnia_${size}x${size}.png"
              if [ -f "$icon" ]; then
                cp "$icon" "$stage/icons/"
              fi
            done

            if [ -f assets/icons/linux/adOmnia_256x256.png ]; then
              cp assets/icons/linux/adOmnia_256x256.png "$stage/adOmnia.png"
            fi

            if [ -f build/linux/adOmnia.desktop ]; then
              cp build/linux/adOmnia.desktop "$stage/"
            fi

            if [ -f build/linux/install.sh ]; then
              cp build/linux/install.sh "$stage/"
              chmod +x "$stage/install.sh"
            fi

            if [ -f build/linux/uninstall.sh ]; then
              cp build/linux/uninstall.sh "$stage/"
            else
              {
                printf '%s\n' '#!/usr/bin/env bash'
                printf '%s\n' 'set -e'
                printf '%s\n' 'if [ "$(id -u)" -ne 0 ]; then'
                printf '%s\n' '    echo "Run with sudo: sudo ./uninstall.sh"'
                printf '%s\n' '    exit 1'
                printf '%s\n' 'fi'
                printf '%s\n' 'rm -rf /opt/adOmnia'
                printf '%s\n' 'rm -f /usr/share/applications/adOmnia.desktop'
                printf '%s\n' 'for sz in 16 24 32 48 64 128 256 512; do'
                printf '%s\n' '    rm -f "/usr/share/icons/hicolor/${sz}x${sz}/apps/adOmnia.png"'
                printf '%s\n' 'done'
                printf '%s\n' 'gtk-update-icon-cache -f -t /usr/share/icons/hicolor 2>/dev/null || true'
                printf '%s\n' 'update-desktop-database /usr/share/applications 2>/dev/null || true'
                printf '%s\n' 'echo "adOmnia removed."'
              } > "$stage/uninstall.sh"
            fi
            chmod +x "$stage/uninstall.sh"

            {
              printf '%s\n' 'adOmnia native Linux build'
              printf '\n'
              printf 'Variant: %s\n' "$variant"
              printf '%s\n' "$readme_note"
              printf '\n'
              printf '%s\n' 'This tarball contains a native Linux amd64 executable. GTK 3 and the'
              printf '%s\n' 'matching WebKitGTK runtime must be available on the target system.'
            } > "$stage/README-linux.txt"

            tar -czf "dist/${basename}.tar.gz" -C "$stage" .
            sha256sum "dist/${basename}.tar.gz" > "dist/${basename}.tar.gz.sha256"
            rm -rf "$stage"
          }

          LDFLAGS="-s -w -X main.Version=${VERSION} -X main.BuildDate=${BUILD_DATE} -X main.GitCommit=${GITHUB_SHA}"

          wails build \
            -clean \
            -platform linux/amd64 \
            -trimpath \
            -ldflags "${LDFLAGS}"
          package_tarball "webkitgtk-4.0" "Built against WebKitGTK 4.0 using the default Wails Linux target."

          wails build \
            -clean \
            -platform linux/amd64 \
            -tags webkit2_41 \
            -trimpath \
            -ldflags "${LDFLAGS}"
          package_tarball "webkitgtk-4.1" "Built against WebKitGTK 4.1 using the Wails build tag webkit2_41."

          ls -lh dist

      - uses: actions/upload-artifact@v7
        with:
          name: adOmnia-linux-amd64
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          retention-days: 30

  macos:
    name: macOS dmg
    needs: checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install packaging tools
        run: |
          brew list create-dmg >/dev/null 2>&1 || brew install create-dmg
          go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}

      - name: Build Apple Silicon app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then VERSION="${GITHUB_SHA::7}"; fi
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          wails build -clean -platform darwin/arm64 -ldflags "-s -w -X main.Version=${VERSION} -X main.BuildDate=${BUILD_DATE} -X main.GitCommit=${GITHUB_SHA}"
          cp build/bin/adOmnia.app/Contents/MacOS/adOmnia /tmp/adOmnia-arm64

      - name: Build Intel app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then VERSION="${GITHUB_SHA::7}"; fi
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          wails build -clean -platform darwin/amd64 -ldflags "-s -w -X main.Version=${VERSION} -X main.BuildDate=${BUILD_DATE} -X main.GitCommit=${GITHUB_SHA}"
          cp build/bin/adOmnia.app/Contents/MacOS/adOmnia /tmp/adOmnia-amd64

      - name: Create universal dmg
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then VERSION="${GITHUB_SHA::7}"; fi
          lipo -create /tmp/adOmnia-arm64 /tmp/adOmnia-amd64 -output build/bin/adOmnia.app/Contents/MacOS/adOmnia
          chmod +x build/bin/adOmnia.app/Contents/MacOS/adOmnia
          lipo -info build/bin/adOmnia.app/Contents/MacOS/adOmnia
          mkdir -p dist
          create-dmg \
            --volname "adOmnia ${VERSION}" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "adOmnia.app" 150 190 \
            --hide-extension "adOmnia.app" \
            --app-drop-link 450 190 \
            "dist/adOmnia-${VERSION}-macos-universal.dmg" \
            "build/bin/" \
          || hdiutil create \
            -volname "adOmnia ${VERSION}" \
            -srcfolder "build/bin/adOmnia.app" \
            -ov -format UDZO \
            "dist/adOmnia-${VERSION}-macos-universal.dmg"

      - uses: actions/upload-artifact@v7
        with:
          name: adOmnia-macos-universal
          path: dist/*.dmg
          retention-days: 30

  bundle:
    name: Bundle artifacts
    needs: [windows, linux, macos]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          ls -lh

      - uses: actions/upload-artifact@v7
        with:
          name: adOmnia-desktop-artifacts
          path: dist/*
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
