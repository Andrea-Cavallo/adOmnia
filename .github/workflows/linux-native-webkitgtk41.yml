name: Linux Native WebKitGTK 4.1

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label for the artifact. Defaults to v-tag version or short SHA.'
        required: false
        type: string
  push:
    tags:
      - 'webkitgtk-4.1*'

env:
  APP_NAME: adOmnia
  NODE_VERSION: '20'
  WAILS_VERSION: v2.12.0
  WEBKITGTK_VARIANT: webkitgtk-4.1
  WAILS_WEBKIT_TAG: webkit2_41

jobs:
  linux-native:
    name: Linux native tar.gz
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Resolve build metadata
        id: meta
        env:
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          if [ -n "${VERSION_INPUT}" ]; then
            VERSION="${VERSION_INPUT}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ] && [[ "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${GITHUB_SHA::7}"
          fi

          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ARTIFACT_BASENAME="${APP_NAME}-${VERSION}-linux-amd64-${WEBKITGTK_VARIANT}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_date=${BUILD_DATE}" >> "$GITHUB_OUTPUT"
          echo "artifact_basename=${ARTIFACT_BASENAME}" >> "$GITHUB_OUTPUT"

      - name: Build native Linux binary against WebKitGTK 4.1
        run: |
          wails build \
            -clean \
            -platform linux/amd64 \
            -tags "${WAILS_WEBKIT_TAG}" \
            -trimpath \
            -ldflags "-s -w -X main.Version=${{ steps.meta.outputs.version }} -X main.BuildDate=${{ steps.meta.outputs.build_date }} -X main.GitCommit=${GITHUB_SHA}"

      - name: Package tar.gz
        run: |
          STAGE="dist/linux-native"
          BASENAME="${{ steps.meta.outputs.artifact_basename }}"

          rm -rf "$STAGE"
          mkdir -p "$STAGE/icons" dist

          cp build/bin/adOmnia "$STAGE/adOmnia"
          chmod +x "$STAGE/adOmnia"

          for size in 16 24 32 48 64 128 256 512; do
            icon="assets/icons/linux/adOmnia_${size}x${size}.png"
            if [ -f "$icon" ]; then
              cp "$icon" "$STAGE/icons/"
            fi
          done

          if [ -f assets/icons/linux/adOmnia_256x256.png ]; then
            cp assets/icons/linux/adOmnia_256x256.png "$STAGE/adOmnia.png"
          fi

          if [ -f build/linux/adOmnia.desktop ]; then
            cp build/linux/adOmnia.desktop "$STAGE/"
          fi

          if [ -f build/linux/install.sh ]; then
            cp build/linux/install.sh "$STAGE/"
            chmod +x "$STAGE/install.sh"
          fi

          cat > "$STAGE/README-linux.txt" <<EOF
          adOmnia native Linux build

          Variant: ${WEBKITGTK_VARIANT}
          Wails build tag: ${WAILS_WEBKIT_TAG}

          This tarball contains a native Linux amd64 executable. It is linked
          against GTK 3 and WebKitGTK 4.1; those runtime libraries must be
          available on the target system.
          EOF

          tar -czf "dist/${BASENAME}.tar.gz" -C "$STAGE" .
          sha256sum "dist/${BASENAME}.tar.gz" > "dist/${BASENAME}.tar.gz.sha256"
          ls -lh dist

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.artifact_basename }}
          path: |
            dist/${{ steps.meta.outputs.artifact_basename }}.tar.gz
            dist/${{ steps.meta.outputs.artifact_basename }}.tar.gz.sha256
          retention-days: 30
