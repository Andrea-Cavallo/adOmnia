name: Quality

# Qualità del codice Go/TS di adOmnia: golangci-lint, govulncheck e SonarCloud.
# I comandi locali equivalgenti stanno in docs/QUALITY.md.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  go-quality:
    name: Go lint and vulnerabilities
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.15.0

      - name: golangci-lint
        run: golangci-lint run --timeout 8m

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Niente segreti nel repository o nella storia: gitleaks è gratuito per i repository
      # personali (per le organization serve GITLEAKS_LICENSE).
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend-deps:
    name: npm audit and lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Audit dependencies
        working-directory: frontend
        run: npm ci && npm audit --audit-level=high

      # oxlint: errori = bug (gate); warning = migrazione React Compiler e stile, visibili nel log.
      - name: oxlint
        working-directory: frontend
        run: npx oxlint

  semgrep:
    name: Semgrep (SAST)
    # Report-only finché la triage dei finding non è completa (docs/QUALITY.md): il risultato
    # resta visibile in ogni run senza bloccare le altre pipeline.
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - uses: returntocorp/semgrep@v1
        with:
          args: semgrep scan --config p/security-audit --config p/secure-defaults --error

  trivy:
    name: Trivy (vuln, secrets, misconfig)
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '0'

  lints:
    name: Scripts and workflows
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: ShellCheck (install and build scripts)
        run: |
          sudo apt-get update -q && sudo apt-get install -y shellcheck
          shellcheck build.sh build/*.sh build/linux/*.sh scripts/*.sh packaging/render.sh

      - name: Hadolint (Dockerfiles)
        run: |
          wget -qO /usr/local/bin/hadolint https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          chmod +x /usr/local/bin/hadolint
          hadolint Dockerfile.linux build/Dockerfile docker/adomnia-lab/mock-api/Dockerfile

      - name: actionlint (GitHub workflows)
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -shellcheck=

  gosec:
    name: gosec (Go security rules)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Solo HIGH/HIGH: le regole opinionate (permessi 0600, sha1 per fingerprint, unsafe Win32)
      # restano un controllo locale documentato in docs/QUALITY.md.
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          "$(go env GOPATH)/bin/gosec" -severity=HIGH -confidence=HIGH -exclude-dir=frontend -exclude-dir=workspaces -exclude-dir=.artifacts ./...

  sonar:
    name: SonarCloud
    # Serve il secret SONAR_TOKEN e i repository variables SONAR_PROJECT_KEY e
    # SONAR_ORGANIZATION (docs/QUALITY.md). Senza configurazione il job salta
    # invece di fallire, così la CI resta verde per chi non usa SonarCloud.
    if: ${{ vars.SONAR_PROJECT_KEY != '' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Coverage Go (i package con Wails/GTK restano fuori: non compilano su ubuntu
      # senza i tag gtk3). Il root package embedda frontend/dist e non entra.
      - name: Coverage (Go)
        run: go test ./internal/... ./cmd/... -coverprofile=coverage.out -covermode=atomic

      - name: Coverage (frontend)
        working-directory: frontend
        run: npm ci && npx vitest run --coverage --coverage.reporter=lcov

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }} -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }} -Dsonar.host.url=https://sonarcloud.io
