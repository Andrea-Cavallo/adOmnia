name: Quality

# Qualità del codice Go/TS di adOmnia: golangci-lint, govulncheck, SAST e scansioni dei segreti.
# SonarCloud è temporaneamente staccato: il suo workflow è stato rimosso e i badge non sono più nel README.
# I comandi locali equivalgenti stanno in docs/QUALITY.md.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Least-privilege default for GITHUB_TOKEN; the gitleaks job raises pull-requests: write to
# keep its PR commenting feature (see the job below).
permissions:
  contents: read

jobs:
  go-quality:
    name: Go lint and vulnerabilities
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      # Compilato con la stessa toolchain del repo: il binario precompilato è costruito con un Go più
      # vecchio e rifiuta i moduli Go 1.27 ("the Go language version used to build golangci-lint is lower").
      - uses: ./.github/actions/go-wails-prereqs

      # Versions pinned: `@latest` would make the gate change from one run to the next. These are CI
      # tools, not runtime dependencies, so they are installed outside the module graph and verified
      # against the Go checksum database instead of go.sum.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 # NOSONAR -- pinned tool binary; see the note above

      - name: golangci-lint
        run: golangci-lint run --build-tags gtk3 --timeout 8m

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0 # NOSONAR -- pinned tool binary; see the note above

      - name: govulncheck
        run: govulncheck -tags gtk3 ./...

  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      # gitleaks-action calls the PR review comment API with the GITHUB_TOKEN
      # (GITLEAKS_ENABLE_COMMENTS defaults to true).
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      # Niente segreti nel repository o nella storia: gitleaks è gratuito per i repository
      # personali (per le organization serve GITLEAKS_LICENSE).
      # Pinned to the commit the v2 tag pointed at: a mutable tag would let whoever controls it
      # change what runs in this repository's CI.
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend-deps:
    name: npm audit and lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Audit dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts && npm audit --audit-level=high

      # oxlint: errori = bug (gate); warning = migrazione React Compiler e stile, visibili nel log.
      # `npm run lint` uses the version from the lockfile instead of letting npx fetch one.
      - name: oxlint
        working-directory: frontend
        run: npm run lint

  semgrep:
    name: Semgrep (SAST)
    # Report-only finché la triage dei finding non è completa (docs/QUALITY.md): il risultato
    # resta visibile in ogni run senza bloccare le altre pipeline.
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # Virtualenv: con `pip --user` urllib3 2.x si mescola con il `requests` di sistema (Python 3.10) e
      # stampa FutureWarning rumorosi; isolato, l'output resta quello di Semgrep.
      - name: Semgrep
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep"
          "$RUNNER_TEMP/semgrep/bin/pip" install --quiet semgrep==1.182.0
          "$RUNNER_TEMP/semgrep/bin/semgrep" scan --config p/security-audit --config p/secure-defaults --error

  trivy:
    name: Trivy (vuln, secrets, misconfig)
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '0'

  lints:
    name: Scripts and workflows
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: ShellCheck (install and build scripts)
        run: |
          sudo apt-get update -q && sudo apt-get install -y shellcheck
          shellcheck build.sh build/*.sh build/linux/*.sh scripts/*.sh packaging/render.sh

      - name: Hadolint (Dockerfiles)
        # --https-only: a redirect to plain HTTP would otherwise be followed silently.
        # --max-redirect: a bounded redirect chain, same policy as the curl below.
        run: |
          wget --https-only --max-redirect 3 -qO /usr/local/bin/hadolint https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          chmod +x /usr/local/bin/hadolint
          hadolint Dockerfile.linux build/Dockerfile docker/adomnia-lab/mock-api/Dockerfile

      # The archive is downloaded to a file and checked against the published SHA-256 before it is
      # extracted and run: nothing that arrives over the network is executed unverified.
      - name: actionlint (GitHub workflows)
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --proto '=https' --tlsv1.2 --max-redirs 3 -fsSL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck=

  gosec:
    name: gosec (Go security rules)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: ./.github/actions/go-wails-prereqs

      # Solo HIGH/HIGH: le regole opinionate (permessi 0600, sha1 per fingerprint, unsafe Win32)
      # restano un controllo locale documentato in docs/QUALITY.md.
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0 # NOSONAR -- pinned tool binary, installed outside the module graph like golangci-lint and govulncheck

      - name: gosec
        run: |
          "$(go env GOPATH)/bin/gosec" -tags=gtk3 -severity=HIGH -confidence=HIGH -exclude-dir=frontend -exclude-dir=workspaces -exclude-dir=.artifacts -exclude-dir=testdata ./...
